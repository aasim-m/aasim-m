name: Validate profile README

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      
      - name: Lint README
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          globs: README.md

  links:
    name: Links and assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out respository
        uses: actions/checkout@v7

      - name: Check links and images
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "$(pwd)"
            --no-progress
            README.md
          fail: true

  workflows:
    name: GitHub actions
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Lint workflow files
      uses: docker://rhysd/actionlint:1.7.12
      with:
        args: -color 